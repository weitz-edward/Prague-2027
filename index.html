<html dir="rtl" lang="he">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Frank Ruhl Libre"', 'serif'],
          body: ['Heebo', 'sans-serif']

          navy:       '#1E2A45',
          navydeep:   '#141D33',
          gold:       '#C9A227',
          goldlight:  '#E8C766',
          terracotta: '#BF5B3E',
          teal:       '#3E7C7C',
          cream:      '#FAF6EF',
          paper:      '#F2ECE0'
        },
        boxShadow: {
          'card': '0 10px 30px -12px rgba(30,42,69,0.25)',

      }
    }
  }

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Fonts: Frank Ruhl Libre (display, Hebrew serif with old-world character) + Heebo (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  html, body { font-family: 'Heebo', sans-serif; }
  body { background: linear-gradient(180deg, #EEF1F3 0%, #F3EFE6 45%, #FAF6EF 100%); background-attachment: fixed; }
  .carousel::-webkit-scrollbar { display:none; }
  .font-display { font-family: 'Frank Ruhl Libre', serif; }
  ::-webkit-scrollbar { display:none; }
  * { scrollbar-width: none; -ms-overflow-style:none; }
  .snap-x-mandatory { scroll-snap-type: x mandatory; }
  .snap-start { scroll-snap-align: start; }
  #bottomNav { padding-bottom: env(safe-area-inset-bottom); }
  #topHeader { padding-top: env(safe-area-inset-top); }
  .tab-panel { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  #infoModal .sheet { transition: transform .3s cubic-bezier(.32,.72,0,1); }
  .checklist-item.checked .check-label { text-decoration: line-through; opacity:.45; }
</style>
</head>

<body class="text-navydeep min-h-screen pb-32">

<!-- ================================================================ -->
<!--  BLOCK: TOP HEADER                                                -->
<!-- ================================================================ -->
<header id="topHeader" class="sticky top-0 z-40 bg-navy text-cream shadow-lg">
  <div class="max-w-md mx-auto px-5 pt-4 pb-4 flex items-center justify-between">
    <div>
      <p class="text-[11px] tracking-wide text-goldlight/80 font-medium">הטיול המשפחתי</p>
      <h1 class="font-display text-2xl font-bold leading-tight">פראג <span class="text-goldlight">2027</span></h1>
    </div>
    <div id="headerWeather" class="flex items-center gap-2 bg-white/10 rounded-2xl px-3 py-2 min-w-[84px] justify-center">
      <i class="fa-solid fa-spinner fa-spin text-goldlight"></i>
    </div>
  </div>
</header>

<!-- ================================================================ -->
<!--  BLOCK: MAIN TAB PANELS                                          -->
<!-- ================================================================ -->
<main class="max-w-md mx-auto px-4 pt-4">

  <!-- ---------- TAB 1: הלו"ז שלנו (Timeline) ---------- -->
  <section id="tab-timeline" class="tab-panel">

    <!-- Day selector -->
    <div id="daySelector" class="flex gap-3 overflow-x-auto snap-x-mandatory pb-2 -mx-1 px-1"></div>

    <!-- Activity feed (each card renders its own "nearby" sub-section if present) -->
    <div id="activityFeed" class="mt-4 flex flex-col gap-4"></div>

  </section>

  <!-- ---------- TAB 2: המלצות (Vault) ---------- -->
  <section id="tab-vault" class="tab-panel hidden">
    <h2 class="font-display text-xl font-bold mb-1 mt-1">המלצות שלנו</h2>
    <p class="text-sm text-navydeep/60 mb-4">מקומות שכדאי לבדוק אם יש זמן פנוי</p>
    <div id="vaultFeed" class="flex flex-col gap-4"></div>
  </section>

  <!-- ---------- TAB 3: מידע ורשימות (Toolkit) ---------- -->
  <section id="tab-toolkit" class="tab-panel hidden">
    <h2 class="font-display text-xl font-bold mb-1 mt-1">מידע ורשימות</h2>
    <p class="text-sm text-navydeep/60 mb-4">כל מה שצריך לדעת, במקום אחד</p>

    <div id="toolkitInfo" class="flex flex-col gap-3 mb-6"></div>

    <!-- Currency Converter -->
    <div class="bg-white rounded-2xl shadow-card p-4 mb-6">
      <h3 class="font-display text-base font-bold mb-1 flex items-center gap-2">
        <i class="fa-solid fa-money-bill-transfer text-gold"></i> מחשבון המרה
      </h3>
      <p class="text-xs text-navydeep/50 mb-4">קורונה צ׳כית (CZK) ↔ שקל (ש״ח)</p>
      <div class="flex items-end gap-2">
        <div class="flex-1">
          <label for="czkInput" class="text-[11px] font-semibold text-navydeep/50 mb-1 block">CZK</label>
          <div class="relative">
            <input id="czkInput" type="number" inputmode="decimal" placeholder="0" oninput="convertCurrency('czk')"
              class="w-full bg-paper rounded-xl pr-3 pl-12 py-3 text-lg font-semibold text-navydeep focus:outline-none focus:ring-2 focus:ring-gold/50 transition">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[11px] text-navydeep/40 font-semibold">CZK</span>
          </div>
        </div>
        <div class="w-9 h-9 rounded-full bg-navy text-cream flex items-center justify-center shrink-0 mb-1.5">
          <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
        </div>
        <div class="flex-1">
          <label for="ilsInput" class="text-[11px] font-semibold text-navydeep/50 mb-1 block">ש״ח</label>
          <div class="relative">
            <input id="ilsInput" type="number" inputmode="decimal" placeholder="0" oninput="convertCurrency('ils')"
              class="w-full bg-paper rounded-xl pr-3 pl-12 py-3 text-lg font-semibold text-navydeep focus:outline-none focus:ring-2 focus:ring-gold/50 transition">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[11px] text-navydeep/40 font-semibold">ש״ח</span>
          </div>
        </div>
      </div>
      <p class="text-[11px] text-navydeep/40 mt-3 text-center">שער משוער: <span id="rateNoteValue"></span> (לעדכן שער מדויק לפני הטיסה)</p>
    </div>

    <!-- Pre-flight admin checklist (distinct terracotta-bordered style) -->
    <div class="bg-white rounded-2xl shadow-card p-4 mb-6 border-2 border-terracotta/30">
      <h3 class="font-display text-base font-bold mb-3 flex items-center gap-2 text-terracotta">
        <span>🔧</span> עדכונים בקוד לפני הטיסה
      </h3>
      <div id="adminChecklist" class="flex flex-col gap-2"></div>
    </div>

    <div class="bg-white rounded-2xl shadow-card p-4">
      <h3 class="font-display text-base font-bold mb-3 flex items-center gap-2">
        <i class="fa-solid fa-suitcase-rolling text-terracotta"></i> רשימת אריזה
      </h3>
      <div id="packingList" class="flex flex-col gap-2"></div>
    </div>
  </section>

</main>

<!-- ================================================================ -->
<!--  BLOCK: BOTTOM NAVIGATION                                        -->
<!-- ================================================================ -->
<nav id="bottomNav" class="fixed bottom-0 inset-x-0 z-50 bg-white shadow-nav">
  <div class="max-w-md mx-auto grid grid-cols-3">
    <button data-tab="timeline" class="nav-btn flex flex-col items-center gap-1 py-3 text-navy">
      <i class="fa-solid fa-map-location-dot text-lg"></i>
      <span class="text-[11px] font-semibold">הלו״ז שלנו</span>
    </button>
    <button data-tab="vault" class="nav-btn flex flex-col items-center gap-1 py-3 text-navydeep/40">
      <i class="fa-solid fa-gem text-lg"></i>
      <span class="text-[11px] font-semibold">המלצות</span>
    </button>
    <button data-tab="toolkit" class="nav-btn flex flex-col items-center gap-1 py-3 text-navydeep/40">
      <i class="fa-solid fa-list-check text-lg"></i>
      <span class="text-[11px] font-semibold">מידע ורשימות</span>
    </button>
  </div>
</nav>

<!-- ================================================================ -->
<!--  BLOCK: MODALS                                                   -->
<!-- ================================================================ -->

<!-- Info Modal -->
<div id="infoModal" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-navydeep/60" onclick="closeModal('infoModal')"></div>
  <div class="sheet absolute bottom-0 inset-x-0 bg-cream rounded-t-3xl max-h-[85vh] overflow-y-auto translate-y-full">
    <div class="sticky top-0 z-10 bg-cream/95 backdrop-blur flex items-center justify-center pt-3 pb-1 relative">
      <div class="w-10 h-1.5 rounded-full bg-navydeep/15"></div>
      <button onclick="closeModal('infoModal')" aria-label="סגור"
        class="absolute left-3 top-1.5 w-8 h-8 rounded-full bg-navydeep/5 text-navydeep/60 flex items-center justify-center active:bg-navydeep/10 transition">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <div id="infoModalContent" class="px-5 pb-8"></div>
  </div>
</div>

/* ---------------------------------------------------------------- */
/*  ITEM REGISTRY                                                    */
/*  Flattens activities, their nested "nearby" items, and vault      */
/*  items into one lookup table so a single generalized modal        */
/*  function can open info for any of them.                          */
/* ---------------------------------------------------------------- */
const ITEM_REGISTRY = {};

function buildRegistry() {
  tripData.forEach(day => {
    day.activities.forEach(a => {
      ITEM_REGISTRY[a.id] = { ...a, kind: "activity" };
      if (a.nearby) {
        a.nearby.forEach((n, i) => {
          const nid = `${a.id}-nearby-${i}`;
          ITEM_REGISTRY[nid] = { ...n, id: nid, kind: "nearby" };
        });
      }
    });
  });
  vaultData.forEach((v, i) => {
    const vid = `vault-${i}`;
    ITEM_REGISTRY[vid] = { ...v, id: vid, kind: "vault" };
  });
}

function itemColor(item) {
  if (item.kind === "activity") return CATEGORY_COLOR[item.category] || "navy";
  if (item.kind === "nearby") return "gold";
  return "teal"; // vault
}

function itemIcon(item) {
  return item.icon || (item.kind === "nearby" ? "fa-location-dot" : item.kind === "vault" ? "fa-gem" : "fa-circle-info");
}

function itemMeta(item) {
  if (item.kind === "activity") return `${item.category} · ${item.time}`;
  if (item.kind === "nearby") return item.distance || "📌 דברים קרובים";
  return item.subtitle || "המלצה";
}

function getWeatherVisual(code) {
  return WEATHER_CODE_MAP[code] || { icon: "fa-cloud", label: "לא זמין" };
}

async function fetchWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${PRAGUE_LAT}&longitude=${PRAGUE_LON}&daily=weather_code,temperature_2m_max,temperature_2m_min&current_weather=true&timezone=Europe%2FBerlin&forecast_days=9`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Weather request failed");
    const data = await res.json();

    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
      fetchedAt: Date.now(),
      data
    }));

    applyWeatherData(data);
  } catch (err) {
    // Offline / failed fetch → fall back to last known cache
    const cached = localStorage.getItem(WEATHER_CACHE_KEY);
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        applyWeatherData(parsed.data, true);
      } catch (e) {
        renderHeaderWeatherError();
      }
    } else {
      renderHeaderWeatherError();
    }
  }
}

// Because the real trip is April 2027, we can't query that date on a
// live forecast API — instead we pull the current upcoming 7-day
// forecast and map it sequentially onto each day of the UI.
function applyWeatherData(data, isFallback) {
  const current = data.current_weather;
  if (current) {
    const currentCode = current.weathercode !== undefined ? current.weathercode : current.weather_code;
    renderHeaderWeather(current.temperature, currentCode, isFallback);
  }
  const daily = data.daily;
  if (!daily) { renderDaySelector(); return; }
  const codes = daily.weather_code || daily.weathercode || [];
  const maxes = daily.temperature_2m_max || [];
  const mins = daily.temperature_2m_min || [];
  tripData.forEach((day, i) => {
    if (codes[i] !== undefined && maxes[i] !== undefined && mins[i] !== undefined) {
      day.weather = { code: codes[i], max: Math.round(maxes[i]), min: Math.round(mins[i]) };
    } else {
      day.weather = { code: null, max: "--", min: "--" };
    }
  });
  renderDaySelector();
}

function renderHeaderWeather(temp, code, isFallback) {
  const v = getWeatherVisual(code);
  const header = document.getElementById("headerWeather");
  header.innerHTML = `
    <i class="fa-solid ${v.icon} text-goldlight"></i>
    <span class="font-semibold text-sm">${Math.round(temp)}°</span>
    ${isFallback ? '<i class="fa-solid fa-cloud-arrow-down text-[10px] text-cream/50" title="נתונים שמורים"></i>' : ''}
  `;
}

function renderHeaderWeatherError() {
  document.getElementById("headerWeather").innerHTML = `
    <i class="fa-solid fa-cloud-question text-goldlight"></i>
    <span class="text-xs">—</span>
  `;
}

          ${w ? `<i class="fa-solid ${w.icon}"></i> ${w.max}°/${w.min}°` : `<i class="fa-solid fa-spinner fa-spin"></i>`}
        </span>
      </button>
    `;
  }).join("");
}

/* ---------------------------------------------------------------- */
/*  RENDER: Activity feed + nearby                                   */
/* ---------------------------------------------------------------- */
const CATEGORY_COLOR = {
  "טיסה": "navy", "לינה": "terracotta", "סיור": "gold", "שייט": "teal", "פנאי": "terracotta", "נסיעה": "teal"
};

function renderDay(dayId) {
  const day = tripData.find(d => d.id === dayId);
  if (!day) return;

  const feed = document.getElementById("activityFeed");
  feed.innerHTML = day.activities.map(a => activityCardHTML(a)).join("");
}

function activityCardHTML(a) {
  const color = CATEGORY_COLOR[a.category] || "navy";
  return `
    <article class="bg-white rounded-2xl shadow-card overflow-hidden">
      <div class="relative">
        <button onclick="openItemInfo('${a.id}')" class="block w-full">
          <img src="${a.images[0]}" alt="${a.title}" class="w-full h-40 object-cover rounded-t-2xl">
        </button>
        <span class="absolute top-3 right-3 bg-white/90 backdrop-blur text-navydeep text-xs font-semibold px-3 py-1 rounded-full flex items-center gap-1 pointer-events-none">
          <i class="fa-solid fa-clock text-[10px]"></i> ${a.time}
        </span>
        ${a.locked ? `
          <span class="absolute top-3 left-3 bg-terracotta text-white text-xs font-semibold w-7 h-7 rounded-full flex items-center justify-center shadow pointer-events-none">
            <i class="fa-solid fa-lock text-[11px]"></i>
          </span>` : ''}
      </div>
      <div class="p-4">
        <div class="flex items-center gap-2 mb-1.5">
          <span class="w-7 h-7 rounded-full bg-${color}/10 text-${color} flex items-center justify-center">
            <i class="fa-solid ${a.icon} text-[13px]"></i>
          </span>
          <span class="text-[11px] font-semibold text-navydeep/50">${a.category}</span>
        </div>
        <h3 class="font-display text-lg font-bold leading-snug mb-3">${a.title}</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="navigateTo('${a.mapQuery}')"
            class="flex items-center justify-center gap-2 bg-navy text-cream rounded-xl py-2.5 text-sm font-semibold active:scale-95 transition">
            <i class="fa-solid fa-diamond-turn-right"></i> נווט
          </button>
          <button onclick="openItemInfo('${a.id}')"
            class="flex items-center justify-center gap-2 bg-paper text-navydeep rounded-xl py-2.5 text-sm font-semibold active:scale-95 transition">
            <i class="fa-solid fa-circle-info"></i> מידע
          </button>
        </div>

        ${a.nearby && a.nearby.length ? nearbySubsectionHTML(a) : ''}
      </div>
    </article>
  `;
}

function nearbySubsectionHTML(a) {
  return `
    <div class="mt-4 pt-4 border-t border-navydeep/10">
      <p class="text-xs font-semibold text-navydeep/50 mb-2 flex items-center gap-1">
        <span>📌</span> דברים קרובים
      </p>
      <div class="flex gap-2 overflow-x-auto snap-x-mandatory -mx-1 px-1 pb-1">
        ${a.nearby.map((n, i) => {
          const nid = `${a.id}-nearby-${i}`;
          return `
            <div onclick="openItemInfo('${nid}')"
              class="snap-start shrink-0 w-32 bg-paper rounded-xl overflow-hidden cursor-pointer active:scale-95 transition">
              <img src="${n.images[0]}" alt="${n.title}" class="w-full h-20 object-cover">
              <div class="p-2">
                <p class="text-xs font-semibold leading-snug">${n.title}</p>
                <p class="text-[10px] text-navydeep/50 mt-0.5 flex items-center gap-1">
                  <i class="fa-solid fa-person-walking"></i> ${n.distance}
                </p>
                <button onclick="event.stopPropagation(); navigateTo('${n.mapQuery}')"
                  class="mt-1.5 pt-1.5 border-t border-navydeep/10 w-full flex items-center gap-1 text-[10px] font-semibold text-teal active:opacity-60 transition">
                  <i class="fa-solid fa-diamond-turn-right"></i> נווט
                </button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

/*  RENDER: Vault tab                                                 */
/* ---------------------------------------------------------------- */

  el.innerHTML = vaultData.map((v, i) => `
    <button onclick="openItemInfo('vault-${i}')" class="text-right bg-white rounded-2xl shadow-card overflow-hidden flex items-stretch">
      <img src="${v.images[0]}" alt="${v.title}" class="w-28 h-28 object-cover shrink-0">
      <div class="p-4 flex flex-col justify-center">
        <h3 class="font-display font-bold text-base mb-1">${v.title}</h3>
        <p class="text-xs text-navydeep/60 leading-relaxed">${v.subtitle}</p>
        <span class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-teal">
          <i class="fa-solid fa-circle-info"></i> לפרטים
        </span>
      </div>
    </button>
  `).join("");
}

/* ---------------------------------------------------------------- */
/*  RENDER: Toolkit tab                                               */
/* ---------------------------------------------------------------- */
function renderToolkit() {
  const infoEl = document.getElementById("toolkitInfo");
  infoEl.innerHTML = toolkitInfo.map(item => `
    <div class="bg-white rounded-2xl shadow-card p-4 flex items-start gap-3">
      <span class="w-9 h-9 rounded-xl bg-${item.color}/10 text-${item.color} flex items-center justify-center shrink-0">
        <i class="fa-solid ${item.icon}"></i>
      </span>
      <div>
        <p class="font-semibold text-sm mb-0.5">${item.title}</p>
        <p class="text-xs text-navydeep/60 leading-relaxed">${item.text}</p>
      </div>
    </div>
  `).join("");

  document.getElementById("rateNoteValue").textContent = `1 CZK ≈ ${CZK_TO_ILS} ש״ח`;

  const savedChecks = JSON.parse(localStorage.getItem("prague_packing_checks") || "{}");
  const listEl = document.getElementById("packingList");
  listEl.innerHTML = packingItems.map((item, i) => {
    const checked = !!savedChecks[i];
    return `
      <label class="checklist-item ${checked ? 'checked' : ''} flex items-center gap-3 py-1.5 cursor-pointer" data-index="${i}">
        <span class="check-box w-5 h-5 rounded-md border-2 ${checked ? 'bg-teal border-teal' : 'border-navydeep/20'} flex items-center justify-center shrink-0">
          <i class="fa-solid fa-check text-white text-[10px] ${checked ? '' : 'hidden'}"></i>
        </span>
        <span class="check-label text-sm">${item}</span>
        <input type="checkbox" class="hidden" ${checked ? 'checked' : ''} onchange="togglePackingItem(${i}, this)">
      </label>
    `;
  }).join("");

  const savedAdminChecks = JSON.parse(localStorage.getItem("prague_admin_checks") || "{}");
  const adminListEl = document.getElementById("adminChecklist");
  adminListEl.innerHTML = adminChecklistItems.map((item, i) => {
    const checked = !!savedAdminChecks[i];
    return `
      <label class="checklist-item ${checked ? 'checked' : ''} flex items-center gap-3 py-1.5 cursor-pointer" data-index="${i}">
        <span class="check-box w-5 h-5 rounded-md border-2 ${checked ? 'bg-terracotta border-terracotta' : 'border-navydeep/20'} flex items-center justify-center shrink-0">
          <i class="fa-solid fa-check text-white text-[10px] ${checked ? '' : 'hidden'}"></i>
        </span>
        <span class="check-label text-sm">${item}</span>
        <input type="checkbox" class="hidden" ${checked ? 'checked' : ''} onchange="toggleAdminItem(${i}, this)">
      </label>
    `;
  }).join("");
}

function convertCurrency(source) {
  const czkInput = document.getElementById("czkInput");
  const ilsInput = document.getElementById("ilsInput");
  if (source === "czk") {
    const czk = parseFloat(czkInput.value);
    ilsInput.value = isNaN(czk) ? "" : (czk * CZK_TO_ILS).toFixed(2);
  } else {
    const ils = parseFloat(ilsInput.value);
    czkInput.value = isNaN(ils) ? "" : (ils / CZK_TO_ILS).toFixed(2);
  }
}

function togglePackingItem(index, input) {
  const saved = JSON.parse(localStorage.getItem("prague_packing_checks") || "{}");
  saved[index] = input.checked;
  localStorage.setItem("prague_packing_checks", JSON.stringify(saved));

  const label = input.closest(".checklist-item");
  label.classList.toggle("checked", input.checked);
  const box = label.querySelector(".check-box");
  const check = label.querySelector(".check-box i");
  box.classList.toggle("bg-teal", input.checked);
  box.classList.toggle("border-teal", input.checked);
  box.classList.toggle("border-navydeep/20", !input.checked);
  check.classList.toggle("hidden", !input.checked);
}

function toggleAdminItem(index, input) {
  const saved = JSON.parse(localStorage.getItem("prague_admin_checks") || "{}");
  saved[index] = input.checked;
  localStorage.setItem("prague_admin_checks", JSON.stringify(saved));

  const label = input.closest(".checklist-item");
  label.classList.toggle("checked", input.checked);
  const box = label.querySelector(".check-box");
  const check = label.querySelector(".check-box i");
  box.classList.toggle("bg-terracotta", input.checked);
  box.classList.toggle("border-terracotta", input.checked);
  box.classList.toggle("border-navydeep/20", !input.checked);
  check.classList.toggle("hidden", !input.checked);
}

/* ---------------------------------------------------------------- */
/*  ACTIONS: navigation, modals, tabs                                 */
/* ---------------------------------------------------------------- */
function selectDay(dayId) {
  currentDayId = dayId;
  renderDaySelector();
  renderDay(dayId);
}

function navigateTo(query) {
  const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;

}

function openItemInfo(id) {
  const item = ITEM_REGISTRY[id];
  if (!item) return;

  const color = itemColor(item);
  const icon = itemIcon(item);
  const meta = itemMeta(item);

  // "Locked" only means the activity is pre-booked for a fixed time —
  // it still opens the standard info sheet, just shows a small badge.
  document.getElementById("infoModalContent").innerHTML = `
    <div class="relative mb-4">
      <div class="carousel flex overflow-x-auto snap-x snap-mandatory gap-3" onscroll="updateCarouselDots(this)">
        ${item.images.map(src => `
          <img src="${src}" alt="${item.title}" class="snap-start shrink-0 w-4/5 aspect-[4/3] object-cover rounded-2xl">
        `).join("")}
      </div>
      ${item.images.length > 1 ? `
        <div class="carousel-dots flex justify-center gap-1.5 mt-2">
          ${item.images.map((_, i) => `<span class="dot w-1.5 h-1.5 rounded-full transition ${i === 0 ? 'bg-navy' : 'bg-navydeep/20'}"></span>`).join("")}
        </div>
      ` : ''}
    </div>
    <div class="flex items-center gap-2 mb-2">
      <span class="w-8 h-8 rounded-full bg-${color}/10 text-${color} flex items-center justify-center">
        <i class="fa-solid ${icon}"></i>
      </span>
      <span class="text-xs font-semibold text-navydeep/50">${meta}</span>
      ${item.kind === "activity" && item.locked ? `
        <span class="text-xs font-semibold text-terracotta flex items-center gap-1 mr-auto">
          <i class="fa-solid fa-lock"></i> מוזמן מראש
        </span>` : ''}
    </div>
    <h2 class="font-display text-2xl font-bold mb-3">${item.title}</h2>
    ${item.description ? `<p class="text-sm text-navydeep/70 leading-relaxed mb-6">${item.description}</p>` : ''}
    <button onclick="navigateTo('${item.mapQuery}')" class="w-full flex items-center justify-center gap-2 bg-navy text-cream rounded-2xl py-3 font-semibold">
      <i class="fa-solid fa-diamond-turn-right"></i> נווט לשם
    </button>
  `;
  openModal("infoModal");
}

// Highlights the active carousel dot as the user swipes through images.
// Accounts for RTL scroll mechanics: some browsers report scrollLeft as
// zero-or-positive from the right edge, others as negative — Math.abs()
// normalizes both so the slide index calculation works either way.
function updateCarouselDots(carouselEl) {
  const dotsWrap = carouselEl.parentElement.querySelector(".carousel-dots");
  if (!dotsWrap) return;
  const dots = dotsWrap.querySelectorAll(".dot");
  if (!dots.length) return;

  const firstSlide = carouselEl.firstElementChild;
  if (!firstSlide) return;
  const slideWidth = firstSlide.getBoundingClientRect().width + 12; // + gap-3 (0.75rem)

  const scrolled = Math.abs(carouselEl.scrollLeft);
  let activeIndex = Math.round(scrolled / slideWidth);
  activeIndex = Math.max(0, Math.min(activeIndex, dots.length - 1));

  dots.forEach((dot, i) => {
    dot.classList.toggle("bg-navy", i === activeIndex);
    dot.classList.toggle("bg-navydeep/20", i !== activeIndex);
  });
}

function openModal(id) {
  const modal = document.getElementById(id);
  modal.classList.remove("hidden");
  requestAnimationFrame(() => {
    modal.querySelector(".sheet").classList.remove("translate-y-full");
  });
}

function closeModal(id) {
  const modal = document.getElementById(id);
  modal.querySelector(".sheet").classList.add("translate-y-full");
  setTimeout(() => modal.classList.add("hidden"), 300);
}

// iOS-style "swipe down to close": only starts dragging the sheet if the
// user is already scrolled to the very top of it, so a normal scroll
// gesture inside the sheet is never hijacked.
function setupSwipeToClose(sheetSelector, modalId) {
  const sheet = document.querySelector(sheetSelector);
  if (!sheet) return;

  let startY = 0;
  let deltaY = 0;
  let dragging = false;

  sheet.addEventListener("touchstart", (e) => {
    dragging = sheet.scrollTop === 0;
    startY = e.touches[0].clientY;
    deltaY = 0;
    if (dragging) sheet.style.transition = "none";
  }, { passive: true });

  sheet.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    deltaY = e.touches[0].clientY - startY;
    if (deltaY > 0) {
      sheet.style.transform = `translateY(${deltaY}px)`;
    }
  }, { passive: true });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = "";
    sheet.style.transform = "";
    if (deltaY > 120) {
      closeModal(modalId);
    }
    deltaY = 0;
  };

  sheet.addEventListener("touchend", endDrag);
  sheet.addEventListener("touchcancel", endDrag);
}

function switchTab(tab) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
  document.getElementById(`tab-${tab}`).classList.remove("hidden");

  document.querySelectorAll(".nav-btn").forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.classList.toggle("text-navy", active);
    btn.classList.toggle("text-navydeep/40", !active);
  });
}

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

function init() {
  buildRegistry();
  renderDaySelector();
  renderDay(currentDayId);
  renderVault();
  renderToolkit();
  fetchWeather();
  setupSwipeToClose("#infoModal .sheet", "infoModal");
}

document.addEventListener("DOMContentLoaded", init);
</script>
