<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<script src="https://cdn.tailwindcss.com"></script>

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Fonts: Frank Ruhl Libre (display, Hebrew serif with old-world character) + Heebo (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  html, body { font-family: 'Heebo', sans-serif; }
  body { background: linear-gradient(180deg, #EEF1F3 0%, #F3EFE6 45%, #FAF6EF 100%); background-attachment: fixed; }
  .carousel::-webkit-scrollbar { display:none; }
  .font-display { font-family: 'Frank Ruhl Libre', serif; }
  ::-webkit-scrollbar { display:none; }
  * { scrollbar-width: none; -ms-overflow-style:none; }
  .snap-x-mandatory { scroll-snap-type: x mandatory; }
  .snap-start { scroll-snap-align: start; }
  #bottomNav { padding-bottom: env(safe-area-inset-bottom); }
  #topHeader { padding-top: env(safe-area-inset-top); }

/* ── Expanded (default) ── */
#topHeader .header-inner {
  padding-top: 1rem;
  padding-bottom: 1rem;
  transition: padding-top .15s ease-out, padding-bottom .15s ease-out;
  will-change: padding-top, padding-bottom;
}
#topHeader .header-tagline {
  max-height: 1.25rem;
  opacity: 1;
  overflow: hidden;
  transition: max-height .15s ease-out, opacity .12s ease-out, margin-bottom .15s ease-out;
}
#topHeader .header-title {
  font-size: 1.5rem;
  transition: font-size .15s ease-out;
}
#topHeader #headerWeather {
  transition: padding .15s ease-out, transform .15s ease-out;
}

/* ── Collapsed ── */
#topHeader.collapsed .header-inner {
  padding-top: 0.4rem;
  padding-bottom: 0.4rem;
}
#topHeader.collapsed .header-tagline {
  max-height: 0;
  opacity: 0;
  margin-bottom: 0;
}
#topHeader.collapsed .header-title {
  font-size: 1.125rem;
}
#topHeader.collapsed #headerWeather {
  padding: 0.25rem 0.625rem;
  transform: scale(.92);
}


  .tab-panel { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  #infoModal .sheet { transition: transform .3s cubic-bezier(.32,.72,0,1); }
  .checklist-item.checked .check-label { text-decoration: line-through; opacity:.45; }
</style>
</head>

<body class="text-navydeep min-h-screen pb-32">

<!-- ================================================================ -->
<!--  BLOCK: TOP HEADER                                                -->
<!-- ================================================================ -->
<header id="topHeader" class="sticky top-0 z-40 bg-navy text-cream shadow-lg">
  <div class="header-inner max-w-md mx-auto px-5 flex items-center justify-between">
    <div class="min-w-0">
      <p class="header-tagline text-[11px] tracking-wide text-goldlight/80 font-medium">הטיול המשפחתי</p>
      <h1 class="header-title font-display font-bold leading-tight">פראג <span class="text-goldlight">2027</span></h1>
    </div>
    <div id="headerWeather" class="flex items-center gap-2 bg-white/10 rounded-2xl px-3 py-2 min-w-[84px] justify-center">
      <i class="fa-solid fa-spinner fa-spin text-goldlight"></i>
    </div>
  </div>
</header>

<!-- ================================================================ -->
<!--  BLOCK: MAIN TAB PANELS                                          -->
<!-- ================================================================ -->
<main class="max-w-md mx-auto px-4 pt-4">

  <!-- ---------- TAB 1: הלו"ז שלנו (Timeline) ---------- -->
  <section id="tab-timeline" class="tab-panel overflow-x-hidden">

    <!-- Day selector -->
    <div id="daySelector" class="flex gap-3 overflow-x-auto snap-x-mandatory pb-2 -mx-1 px-1"></div>

    <!-- Activity feed (each card renders its own "nearby" sub-section if present) -->
    <div id="activityFeed" class="mt-4 flex flex-col gap-4"></div>

  </section>

  <!-- ---------- TAB 2: המלצות (Vault) ---------- -->
  <section id="tab-vault" class="tab-panel hidden">
    <h2 class="font-display text-xl font-bold mb-1 mt-1">המלצות שלנו</h2>
    <p class="text-sm text-navydeep/60 mb-4">מקומות שכדאי לבדוק אם יש זמן פנוי</p>
    <div id="vaultFeed" class="flex flex-col gap-4"></div>
  </section>

  <!-- ---------- TAB 3: מידע (Info) ---------- -->
  <section id="tab-info" class="tab-panel hidden">
    <h2 class="font-display text-xl font-bold mb-1 mt-1">מידע</h2>
    <p class="text-sm text-navydeep/60 mb-4">כל מה שצריך לדעת לפני שיוצאים</p>

    <!-- Public Transport card (rendered by renderToolkit as the first toolkitInfo item) -->
    <div id="toolkitInfoTop" class="flex flex-col gap-3 mb-6"></div>

    <!-- Currency Converter -->
    <div class="bg-white rounded-2xl shadow-card p-4 mb-6">
      <h3 class="font-display text-base font-bold mb-1 flex items-center gap-2">
        <i class="fa-solid fa-money-bill-transfer text-gold"></i> מחשבון המרה
      </h3>
      <p class="text-xs text-navydeep/50 mb-4">קורונה צ׳כית (CZK) ↔ שקל (ש״ח)</p>
      <div class="flex items-end gap-2">
        <div class="flex-1">
          <label for="czkInput" class="text-[11px] font-semibold text-navydeep/50 mb-1 block">CZK</label>
          <div class="relative">
            <input id="czkInput" type="number" inputmode="decimal" placeholder="0" oninput="convertCurrency('czk')"
              class="w-full bg-paper rounded-xl pr-3 pl-12 py-3 text-lg font-semibold text-navydeep focus:outline-none focus:ring-2 focus:ring-gold/50 transition">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[11px] text-navydeep/40 font-semibold">CZK</span>
          </div>
        </div>
        <div class="w-9 h-9 rounded-full bg-navy text-cream flex items-center justify-center shrink-0 mb-1.5">
          <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
        </div>
        <div class="flex-1">
          <label for="ilsInput" class="text-[11px] font-semibold text-navydeep/50 mb-1 block">ש״ח</label>
          <div class="relative">
            <input id="ilsInput" type="number" inputmode="decimal" placeholder="0" oninput="convertCurrency('ils')"
              class="w-full bg-paper rounded-xl pr-3 pl-12 py-3 text-lg font-semibold text-navydeep focus:outline-none focus:ring-2 focus:ring-gold/50 transition">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[11px] text-navydeep/40 font-semibold">ש״ח</span>
          </div>
        </div>
      </div>
      <p class="text-[11px] text-navydeep/40 mt-3 text-center">שער עדכני: <span id="rateNoteValue"></span></p>
    </div>

    <!-- Remaining info cards (rendered by renderToolkit as the rest of toolkitInfo) -->
    <div id="toolkitInfoRest" class="flex flex-col gap-3 mb-6"></div>
  </section>

  <!-- ---------- TAB 4: רשימות (Lists) ---------- -->
  <section id="tab-lists" class="tab-panel hidden">
    <h2 class="font-display text-xl font-bold mb-1 mt-1">רשימות</h2>
    <p class="text-sm text-navydeep/60 mb-4">מה צריך להכין ומה נשאר לסדר</p>

    <!-- Pre-flight admin checklist (distinct terracotta-bordered style) -->
    <div class="bg-white rounded-2xl shadow-card p-4 mb-6 border-2 border-terracotta/30">
      <h3 class="font-display text-base font-bold mb-3 flex items-center gap-2 text-terracotta">
        <span>🔧</span> עדכונים בקוד לפני הטיסה
      </h3>
      <div id="adminChecklist" class="flex flex-col gap-2"></div>
    </div>

    <div class="bg-white rounded-2xl shadow-card p-4">
      <h3 class="font-display text-base font-bold mb-3 flex items-center gap-2">
        <i class="fa-solid fa-suitcase-rolling text-terracotta"></i> רשימת אריזה
      </h3>
      <div id="packingList" class="flex flex-col gap-2"></div>
    </div>
  </section>

</main>

<!-- ================================================================ -->
<!--  BLOCK: BOTTOM NAVIGATION                                        -->
<!-- ================================================================ -->
<nav id="bottomNav" class="fixed bottom-0 inset-x-0 z-50 bg-white shadow-nav">
  <div class="max-w-md mx-auto grid grid-cols-4">
    <button data-tab="timeline" class="nav-btn flex flex-col items-center gap-1 py-3 text-navy">
      <i class="fa-solid fa-map-location-dot text-lg"></i>
      <span class="text-[11px] font-semibold">הלו״ז שלנו</span>
    </button>
    <button data-tab="vault" class="nav-btn flex flex-col items-center gap-1 py-3 text-navydeep/40">
      <i class="fa-solid fa-gem text-lg"></i>
      <span class="text-[11px] font-semibold">המלצות</span>
    </button>
    <button data-tab="info" class="nav-btn flex flex-col items-center gap-1 py-3 text-navydeep/40">
      <i class="fa-solid fa-circle-info text-lg"></i>
      <span class="text-[11px] font-semibold">מידע</span>
    </button>
    <button data-tab="lists" class="nav-btn flex flex-col items-center gap-1 py-3 text-navydeep/40">
      <i class="fa-solid fa-list-check text-lg"></i>
      <span class="text-[11px] font-semibold">רשימות</span>
    </button>
  </div>
</nav>

<!-- ================================================================ -->
<!--  BLOCK: MODALS                                                   -->
<!-- ================================================================ -->

<!-- Info Modal -->
<div id="infoModal" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-navydeep/60" onclick="closeModal('infoModal')"></div>
  <div class="sheet absolute bottom-0 inset-x-0 bg-cream rounded-t-3xl max-h-[85vh] overflow-y-auto translate-y-full">
    <div class="sticky top-0 z-10 bg-cream/95 backdrop-blur flex items-center justify-center pt-3 pb-1 relative">
      <div class="w-10 h-1.5 rounded-full bg-navydeep/15"></div>
      <button onclick="closeModal('infoModal')" aria-label="סגור"
        class="absolute left-3 top-1.5 w-8 h-8 rounded-full bg-navydeep/5 text-navydeep/60 flex items-center justify-center active:bg-navydeep/10 transition">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <div id="infoModalContent" class="px-5 pb-8"></div>
  </div>
</div>

// If an image URL ends in .jpg but the file on disk is actually .jfif / .webp
// / .png / .jpeg, the browser will 404 on first try. This handler swaps in
// each alternate extension in order until one succeeds — so we can commit
// the file without knowing which extension the user actually uploaded.
// The counter on `dataset.extAttempt` prevents infinite loops.
const IMG_EXT_FALLBACKS = ["jpg", "jfif", "webp", "png", "jpeg", "avif"];
function tryAltExt(img) {
  const attempt = parseInt(img.dataset.extAttempt || "0", 10) + 1;
  if (attempt >= IMG_EXT_FALLBACKS.length) {
    img.onerror = null; // Give up — will show broken-image icon
    return;
  }
  const nextExt = IMG_EXT_FALLBACKS[attempt];
  // Replace the trailing .ext (before an optional ?query or end of URL).
  const swapped = img.src.replace(/\.(jpg|jfif|webp|png|jpeg|avif)(?=$|\?)/i, "." + nextExt);
  if (swapped === img.src) { img.onerror = null; return; } // Nothing to swap
  img.dataset.extAttempt = attempt;
  img.src = swapped;
}

// Fetches a live 9-day forecast for Prague from Open-Meteo. Handles
// both the legacy `weathercode` and current `weather_code` field names
// (Open-Meteo accepts either as an alias), and gracefully falls back to
// a cached copy on failure so the timeline never spins forever.
async function fetchWeather() {
  // We request BOTH the current and legacy daily variable names in the
  // URL. Open-Meteo accepts either alias — whichever it recognises
  // becomes the key on `data.daily`, and we normalise both in the
  // parser. `current_weather=true` still uses the legacy `weathercode`
  // in the response, which we also handle.
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${PRAGUE_LAT}&longitude=${PRAGUE_LON}&daily=weather_code,temperature_2m_max,temperature_2m_min&current_weather=true&timezone=Europe%2FBerlin&forecast_days=9`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();
    console.info("[weather] fetched", data);

    // Cache raw response before touching anything else so a bad
    // parser change can't corrupt the fallback.
    try {
      localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data }));
    } catch (storageErr) {
      console.warn("[weather] localStorage.setItem failed:", storageErr);
    }

    applyWeatherData(data, false);
  } catch (err) {
    console.warn("[weather] live fetch failed, trying cache:", err);
    const cached = localStorage.getItem(WEATHER_CACHE_KEY);
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (parsed && parsed.data) {
          applyWeatherData(parsed.data, true);
          return;
        }
      } catch (parseErr) {
        console.warn("[weather] cache parse failed:", parseErr);
      }
    }
    // No cache at all — degrade gracefully: show a placeholder in the
    // header and leave each day's weather at "--" so nothing renders as
    // NaN or undefined.
    renderHeaderWeatherError();
    tripData.forEach(day => { day.weather = { code: null, max: "--", min: "--" }; });
    renderDaySelector();
  }
}

// Maps the API response onto tripData. Defensive on every field:
//   • daily.weather_code OR daily.weathercode (both are accepted)
//   • temperature_2m_max / temperature_2m_min
//   • current_weather.temperature + current_weather.weathercode OR weather_code
// Missing values render as "--" (not 0, which would falsely say "sunny 0°").
function applyWeatherData(data, isFallback) {
  if (!data) {
    console.warn("[weather] applyWeatherData called with no data");
    renderHeaderWeatherError();
    return;
  }

  // -- Header (current weather) --
  const current = data.current_weather || data.current || null;
  if (current && typeof current.temperature === "number") {
    const cCode = current.weathercode !== undefined ? current.weathercode
                : current.weather_code !== undefined ? current.weather_code
                : null;
    renderHeaderWeather(current.temperature, cCode, isFallback);
  } else {
    console.warn("[weather] no current_weather in response");
    renderHeaderWeatherError();
  }

  // -- Daily forecast per day --
  const daily = data.daily;
  const codes = (daily && (daily.weather_code || daily.weathercode)) || null;
  const maxes = (daily && daily.temperature_2m_max) || null;
  const mins  = (daily && daily.temperature_2m_min) || null;

  if (!Array.isArray(codes) || !Array.isArray(maxes) || !Array.isArray(mins)) {
    console.warn("[weather] daily arrays missing or malformed. codes:", codes, "maxes:", maxes, "mins:", mins);
    tripData.forEach(day => { day.weather = { code: null, max: "--", min: "--" }; });
    renderDaySelector();
    return;
  }

  // Strict index mapping: live API day i → tripData[i]. If the API
  // returns fewer days than we have (rare — we asked for 9), any
  // uncovered days show "--" rather than fake data.
  tripData.forEach((day, i) => {
    const code = codes[i];
    const max = maxes[i];
    const min = mins[i];
    if (typeof code === "number" && typeof max === "number" && typeof min === "number") {
      day.weather = { code, max: Math.round(max), min: Math.round(min) };
    } else {
      day.weather = { code: null, max: "--", min: "--" };
    }
  });

  renderDaySelector();
}

function renderHeaderWeather(temp, code, isFallback) {

  const header = document.getElementById("headerWeather");
  header.innerHTML = `
    <i class="fa-solid ${v.icon} text-goldlight"></i>
    <span class="font-semibold text-sm">${Math.round(temp)}°</span>
    ${isFallback ? '<i class="fa-solid fa-cloud-arrow-down text-[10px] text-cream/50" title="נתונים שמורים"></i>' : ''}
  `;
}

}

  const savedAdminChecks = JSON.parse(localStorage.getItem("prague_admin_checks") || "{}");
  const adminListEl = document.getElementById("adminChecklist");
  adminListEl.innerHTML = adminChecklistItems.map((item, i) => {
    const checked = !!savedAdminChecks[i];
    return `
      <label class="checklist-item ${checked ? 'checked' : ''} flex items-center gap-3 py-1.5 cursor-pointer" data-index="${i}">
        <span class="check-box w-5 h-5 rounded-md border-2 ${checked ? 'bg-terracotta border-terracotta' : 'border-navydeep/20'} flex items-center justify-center shrink-0">
          <i class="fa-solid fa-check text-white text-[10px] ${checked ? '' : 'hidden'}"></i>
        </span>
        <span class="check-label text-sm">${item}</span>
        <input type="checkbox" class="hidden" ${checked ? 'checked' : ''} onchange="toggleAdminItem(${i}, this)">
      </label>
    `;
  }).join("");
}

function convertCurrency(source) {
  const czkInput = document.getElementById("czkInput");
  const ilsInput = document.getElementById("ilsInput");
  if (source === "czk") {
    const czk = parseFloat(czkInput.value);
    ilsInput.value = isNaN(czk) ? "" : (czk * CZK_TO_ILS).toFixed(2);
  } else {
    const ils = parseFloat(ilsInput.value);
    czkInput.value = isNaN(ils) ? "" : (ils / CZK_TO_ILS).toFixed(2);
  }
}

// Pulls a live CZK → ILS exchange rate so the converter doesn't rely on a
// stale hardcoded number. Falls back to the last rate saved in
// localStorage if the request fails (offline, API down, etc.).
async function fetchExchangeRate() {
  try {
    const res = await fetch('https://api.frankfurter.app/latest?from=CZK&to=ILS');
    const data = await res.json();
    CZK_TO_ILS = data.rates.ILS;
    localStorage.setItem('prague_czk_rate', CZK_TO_ILS);
    document.getElementById("rateNoteValue").textContent = `1 CZK ≈ ${CZK_TO_ILS.toFixed(3)} ש״ח (Live)`;
  } catch(e) {
    const saved = localStorage.getItem('prague_czk_rate');
    if (saved) {
      CZK_TO_ILS = parseFloat(saved);
      document.getElementById("rateNoteValue").textContent = `1 CZK ≈ ${CZK_TO_ILS.toFixed(3)} ש״ח (Saved)`;
    }
  }
}

function togglePackingItem(index, input) {
  const saved = JSON.parse(localStorage.getItem("prague_packing_checks") || "{}");
  saved[index] = input.checked;
  localStorage.setItem("prague_packing_checks", JSON.stringify(saved));

  const label = input.closest(".checklist-item");
  label.classList.toggle("checked", input.checked);
  const box = label.querySelector(".check-box");
  const check = label.querySelector(".check-box i");
  box.classList.toggle("bg-teal", input.checked);
  box.classList.toggle("border-teal", input.checked);
  box.classList.toggle("border-navydeep/20", !input.checked);
  check.classList.toggle("hidden", !input.checked);
}

function toggleAdminItem(index, input) {
  const saved = JSON.parse(localStorage.getItem("prague_admin_checks") || "{}");
  saved[index] = input.checked;
  localStorage.setItem("prague_admin_checks", JSON.stringify(saved));

  const label = input.closest(".checklist-item");
  label.classList.toggle("checked", input.checked);
  const box = label.querySelector(".check-box");
  const check = label.querySelector(".check-box i");
  box.classList.toggle("bg-terracotta", input.checked);
  box.classList.toggle("border-terracotta", input.checked);
  box.classList.toggle("border-navydeep/20", !input.checked);
  check.classList.toggle("hidden", !input.checked);
}

function selectDay(dayId) {
  currentDayId = dayId;
  renderDaySelector();
  renderDay(dayId);
  // Scroll the newly-active day into view in the horizontal tab strip,
  // so if the user is on a day that's currently off-screen after a swipe,
  // the day-selector auto-centers on it.
  const idx = tripData.findIndex(d => d.id === dayId);
  const buttons = document.querySelectorAll("#daySelector button");
  if (buttons[idx]) {
    buttons[idx].scrollIntoView({ inline: "center", behavior: "smooth", block: "nearest" });
  }
}

// Horizontal swipe on the timeline body switches days — like an iOS pager.
// In RTL: swipe RIGHT (finger moves left→right) = previous (earlier) day.
//         swipe LEFT  (finger moves right→left) = next (later) day.
// Ignores swipes that start inside a horizontally-scrolling child
// (day selector at top, nearby-items strip inside cards) so those still
// scroll naturally. Also ignores mostly-vertical swipes so the activity
// feed continues to scroll up/down as usual.
function setupSwipeBetweenDays() {
  const timeline = document.getElementById("tab-timeline");
  const feed = document.getElementById("activityFeed");
  if (!timeline || !feed) return;

  const SWIPE_THRESHOLD = 60;   // px — how far to drag before committing
  const DIRECTION_LOCK = 10;    // px — decide horizontal vs vertical after this much movement
  const SPRING = "cubic-bezier(.32,.72,0,1)"; // native iOS spring feel
  const DUR = 240;              // ms — one leg of the two-leg page-turn animation

  let startX = 0, startY = 0;
  let tracking = false, axis = null;
  let currentDx = 0;
  let animating = false;        // Guards against overlapping swipes mid-animation

  timeline.addEventListener("touchstart", (e) => {
    if (animating) { tracking = false; return; }
    // Don't hijack swipes that start inside a horizontally-scrollable element
    // (day tabs, nearby-items strip) — those still get native scroll.
    if (e.target.closest(".overflow-x-auto")) { tracking = false; return; }
    tracking = true;
    axis = null;
    currentDx = 0;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    feed.style.transition = "none";
  }, { passive: true });

  timeline.addEventListener("touchmove", (e) => {
    if (!tracking) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;

    // Direction lock — first significant movement decides whether this is a
    // horizontal page turn or a vertical scroll of the feed. Once locked
    // vertical, we let the browser scroll and stop tracking.
    if (axis === null) {
      if (Math.abs(dx) < DIRECTION_LOCK && Math.abs(dy) < DIRECTION_LOCK) return;
      axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
    if (axis !== "x") return;

    // We're actively page-turning — block the browser's vertical scroll for
    // this gesture so the page follows the finger without also scrolling.
    e.preventDefault();
    currentDx = dx;

    // Rubber-band at first/last day — the page still follows the finger, but
    // with resistance so it's obvious you're at the edge.
    // Swipe right on the LAST day = trying to advance past day 9 → rubber-band.
    // Swipe left on the FIRST day = trying to go before day 1 → rubber-band.
    const idx = tripData.findIndex(d => d.id === currentDayId);
    let visualDx = dx;
    if ((dx > 0 && idx === tripData.length - 1) || (dx < 0 && idx === 0)) {
      visualDx = dx / 3;
    }
    feed.style.transform = `translateX(${visualDx}px)`;
  }, { passive: false });

  const endDrag = () => {
    if (!tracking) return;
    tracking = false;
    if (axis !== "x") return;

    const dx = currentDx;
    const feedWidth = feed.offsetWidth;
    const idx = tripData.findIndex(d => d.id === currentDayId);
    const past = Math.abs(dx) > SWIPE_THRESHOLD;
    // User's mental model: swipe right (dx > 0) = push current day rightward
    // toward where earlier days live in the RTL tab strip → NEXT day arrives
    // from the left. So dir = +1 (advance to later date) for swipe right.
    const dir = dx > 0 ? 1 : -1;
    const newIdx = idx + dir;
    const canTurn = past && newIdx >= 0 && newIdx < tripData.length;

    if (!canTurn) {
      // Snap back to 0 with spring easing
      feed.style.transition = `transform ${DUR}ms ${SPRING}`;
      feed.style.transform = "translateX(0)";
      setTimeout(() => {
        feed.style.transition = "";
        feed.style.transform = "";
      }, DUR);
      return;
    }

    // Page-turn: two-leg animation.
    // Leg 1: current day's feed slides fully off screen in the swipe direction
    // Leg 2: new day's feed slides in from the opposite side
    animating = true;
    const offX = dx > 0 ? feedWidth : -feedWidth;
    feed.style.transition = `transform ${DUR}ms ${SPRING}`;
    feed.style.transform = `translateX(${offX}px)`;

    setTimeout(() => {
      // Swap the day (this re-renders both the day tabs and the activity feed)
      currentDayId = tripData[newIdx].id;
      renderDaySelector();
      renderDay(currentDayId);
      // Auto-center the newly-active tab in the top day strip
      const buttons = document.querySelectorAll("#daySelector button");
      if (buttons[newIdx]) {
        buttons[newIdx].scrollIntoView({ inline: "center", behavior: "smooth", block: "nearest" });
      }
      // Position the new content off-screen on the OPPOSITE side (no animation)
      feed.style.transition = "none";
      feed.style.transform = `translateX(${-offX}px)`;
      // Force reflow so the browser commits that position before we animate
      void feed.offsetWidth;
      // Leg 2: slide in to 0
      feed.style.transition = `transform ${DUR}ms ${SPRING}`;
      feed.style.transform = "translateX(0)";
      setTimeout(() => {
        feed.style.transition = "";
        feed.style.transform = "";
        animating = false;
      }, DUR);
    }, DUR);
  };

  timeline.addEventListener("touchend", endDrag, { passive: true });
  timeline.addEventListener("touchcancel", endDrag, { passive: true });
}

// Highlights the active carousel dot as the user swipes through images.
// Accounts for RTL scroll mechanics: some browsers report scrollLeft as
// zero-or-positive from the right edge, others as negative — Math.abs()
// normalizes both so the slide index calculation works either way.
function updateCarouselDots(carouselEl) {
  const dotsWrap = carouselEl.parentElement.querySelector(".carousel-dots");
  if (!dotsWrap) return;
  const dots = dotsWrap.querySelectorAll(".dot");
  if (!dots.length) return;

  const firstSlide = carouselEl.firstElementChild;
  if (!firstSlide) return;
  const slideWidth = firstSlide.getBoundingClientRect().width + 12; // + gap-3 (0.75rem)

  const scrolled = Math.abs(carouselEl.scrollLeft);
  let activeIndex = Math.round(scrolled / slideWidth);
  activeIndex = Math.max(0, Math.min(activeIndex, dots.length - 1));

  dots.forEach((dot, i) => {
    dot.classList.toggle("bg-navy", i === activeIndex);
    dot.classList.toggle("bg-navydeep/20", i !== activeIndex);
  });
}

function openModal(id) {
  const modal = document.getElementById(id);
  const sheet = modal.querySelector(".sheet");
  // Clear any inline transform left over from a prior swipe-to-close so
  // the sheet always starts its open animation from off-screen.
  sheet.style.transform = "";
  modal.classList.remove("hidden");
  document.body.classList.add("overflow-hidden");
  requestAnimationFrame(() => {
    sheet.classList.remove("translate-y-full");
  });
}

function closeModal(id) {
  const modal = document.getElementById(id);
  modal.querySelector(".sheet").classList.add("translate-y-full");
  document.body.classList.remove("overflow-hidden");
  setTimeout(() => modal.classList.add("hidden"), 300);
}

// iOS-style "swipe down to close" — buttery-smooth version:
//   • Only engages when the sheet is scrolled to the top AND the user is
//     dragging DOWN, so the internal scroll of the sheet is never
//     hijacked, and the background never scrolls with it (we use
//     `{ passive: false }` and preventDefault while actively dragging so
//     the browser doesn't rubber-band the page).
//   • touchmove updates the transform inside a requestAnimationFrame so
//     the transform assignment doesn't run more often than the display
//     can paint — that removes the jitter.
//   • On release, we always restore the CSS transition first, then
//     either snap the sheet back to 0 with a spring-like ease-out
//     (buttery snap-back) or hand off to `closeModal` which slides it
//     off-screen with the same transition — no jump-cut, no flicker.
function setupSwipeToClose(sheetSelector, modalId) {
  const sheet = document.querySelector(sheetSelector);
  if (!sheet) return;

  const SPRING_EASING = "cubic-bezier(.32,.72,0,1)"; // matches native iOS sheet
  const CLOSE_THRESHOLD = 100;

  let startY = 0;
  let deltaY = 0;
  let dragging = false;
  let rafId = null;
  let pendingY = 0;

  const applyPendingTransform = () => {
    rafId = null;
    if (!dragging) return;
    sheet.style.transform = `translateY(${pendingY}px)`;
  };

  sheet.addEventListener("touchstart", (e) => {
    // Only allow drag-to-close when the sheet is already at the top —
    // otherwise the user is trying to scroll the sheet content.
    if (sheet.scrollTop > 0) { dragging = false; return; }
    dragging = true;
    startY = e.touches[0].clientY;
    deltaY = 0;
    pendingY = 0;
    // Kill the CSS transition while the finger is on the screen so the
    // sheet tracks 1:1 with the touch, then restore it on release.
    sheet.style.transition = "none";
  }, { passive: true });

  // passive: false so we can preventDefault and stop the page from
  // rubber-banding under the sheet while dragging.
  sheet.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    deltaY = e.touches[0].clientY - startY;
    if (deltaY <= 0) {
      // Dragging up while at scrollTop 0 — let the browser handle it
      // (natural scroll), don't try to move the sheet.
      pendingY = 0;
      if (rafId === null) rafId = requestAnimationFrame(applyPendingTransform);
      return;
    }
    // Actively dragging the sheet down — take over from the browser.
    e.preventDefault();
    pendingY = deltaY;
    if (rafId === null) rafId = requestAnimationFrame(applyPendingTransform);
  }, { passive: false });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }

    const DUR = 260;
    sheet.style.transition = `transform ${DUR}ms ${SPRING_EASING}`;

    if (deltaY > CLOSE_THRESHOLD) {
      // The current inline transform (translateY(deltaY)) has higher specificity
      // than any class-based transform, so calling closeModal alone would leave
      // the sheet stuck mid-drag. Animate the inline transform all the way off
      // screen ourselves, THEN hide the modal — that's why closing felt sticky
      // before, it never actually finished sliding down.
      const sheetHeight = sheet.offsetHeight;
      sheet.style.transform = `translateY(${sheetHeight}px)`;
      setTimeout(() => {
        const modal = document.getElementById(modalId);
        modal.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
        // Reset for the next open — clear the inline drag state and put the
        // class-based off-screen position back so the next openModal animates
        // from off-screen up.
        sheet.style.transition = "";
        sheet.style.transform = "";
        sheet.classList.add("translate-y-full");
      }, DUR);
    } else {
      // Snap back to 0 with spring easing
      sheet.style.transform = "translateY(0)";
      setTimeout(() => {
        // Clear inline styles so the next drag starts from a clean state
        sheet.style.transition = "";
        sheet.style.transform = "";
      }, DUR);
    }

    deltaY = 0;
  };

  sheet.addEventListener("touchend", endDrag);
  sheet.addEventListener("touchcancel", endDrag);
}

function switchTab(tab) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
  document.getElementById(`tab-${tab}`).classList.remove("hidden");

  document.querySelectorAll(".nav-btn").forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.classList.toggle("text-navy", active);
    btn.classList.toggle("text-navydeep/40", !active);
  });
}

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

/*  INIT                                                              */
/* ---------------------------------------------------------------- */
// Collapses the sticky top header once the user has scrolled a bit,
// shrinking padding + title + weather pill so it takes ~50-55px instead
// of ~80px. Uses requestAnimationFrame throttling so the scroll listener
// stays cheap even on long lists.
function setupCollapsingHeader() {
  const header = document.getElementById("topHeader");
  if (!header) return;

  const COLLAPSE_AT = 50;   // scroll down past this → collapse
  const EXPAND_AT = 45;     // scroll up below this → expand
  let collapsed = false;
  let lastY = window.scrollY || 0;
  let ticking = false;

  const update = () => {
    ticking = false;
    const y = window.scrollY || document.documentElement.scrollTop;
    const direction = y - lastY; // positive = scrolling down
    lastY = y;

    if (!collapsed && y > COLLAPSE_AT && direction > 0) {
      // Only collapse when actively scrolling DOWN past the threshold
      header.classList.add("collapsed");
      collapsed = true;
    } else if (collapsed && y < EXPAND_AT && direction < 0) {
      // Expand when scrolling UP below the expand threshold
      header.classList.remove("collapsed");
      collapsed = false;
    }
  };

  window.addEventListener("scroll", () => {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });

  update();
}



function init() {
  buildRegistry();
  renderDaySelector();
  renderDay(currentDayId);
  renderVault();
  renderToolkit();
  fetchWeather();
  fetchExchangeRate();
  setupSwipeToClose("#infoModal .sheet", "infoModal");
  setupSwipeBetweenDays();
  setupCollapsingHeader();
}

document.addEventListener("DOMContentLoaded", init);
